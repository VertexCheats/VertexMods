<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex Mods — Downloads</title>
<meta name="description" content="Download Vertex Mods — pick your Minecraft version and grab the right build.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:            #0a0503;
    --bg-elev:       #120907;
    --panel:         #0d0705;
    --pill-bg:       #0b0605;
    --ink:           #f6ede4;
    --ink-dim:       #baa89c;
    --ink-faint:     #7c6a60;

    --ember:         #ff6a2b;
    --ember-soft:    #ffb37a;
    --crimson:       #b21f1f;
    --gold:          #ffc46b;
    --ok:            #1eaa63;
    --ok-soft:       #3fd991;

    --line:          rgba(255,150,90,0.16);
    --line-strong:   rgba(255,150,90,0.32);

    --radius-l:      20px;
    --radius-m:      14px;
    --radius-pill:   999px;

    --ease:          cubic-bezier(.22,.61,.36,1);
    --font-display:  'Space Grotesk', system-ui, sans-serif;
    --font-body:     'Inter', system-ui, sans-serif;
    --font-mono:     'JetBrains Mono', monospace;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(ellipse 90% 55% at 50% -8%, #1c0d09 0%, var(--bg) 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:min(10vh,90px) 20px 80px;
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }
  ::selection{ background:var(--ember); color:#1a0a04; }
  :focus-visible{
    outline:2px solid var(--ember-soft);
    outline-offset:3px;
    border-radius:6px;
  }

  /* faint ambient glow, purely decorative */
  body::before{
    content:'';
    position:fixed;
    inset:auto auto -20vw -10vw;
    width:60vw; height:60vw;
    background:radial-gradient(circle, var(--crimson) 0%, transparent 70%);
    opacity:0.28;
    filter:blur(100px);
    z-index:-1;
    pointer-events:none;
  }
  body::after{
    content:'';
    position:fixed;
    inset:-14vw -14vw auto auto;
    width:46vw; height:46vw;
    background:radial-gradient(circle, var(--ember) 0%, transparent 72%);
    opacity:0.18;
    filter:blur(100px);
    z-index:-1;
    pointer-events:none;
  }

  .page{
    width:100%;
    max-width:520px;
  }

  .page-head{
    text-align:center;
    margin-bottom:40px;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ember-soft);
    margin:0 0 12px;
  }
  .page-head h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(1.7rem, 4.5vw, 2.3rem);
    margin:0 0 10px;
  }
  .page-head p{
    color:var(--ink-dim);
    margin:0;
    font-size:0.96rem;
  }

  /* ============================================================
     Version selector
     ============================================================ */
  .version-block{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:36px;
  }
  .version-label{
    font-family:var(--font-mono);
    font-size:0.7rem;
    font-weight:500;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin:0 0 10px;
  }

  .version-pill{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:28px;
    width:100%;
    max-width:280px;
    padding:14px 18px 14px 22px;
    border-radius:var(--radius-pill);
    background:var(--pill-bg);
    border:1px solid var(--line-strong);
    box-shadow:
      0 0 0 1px rgba(255,110,50,0.05),
      0 0 24px -6px rgba(255,106,43,0.45),
      inset 0 1px 0 rgba(255,255,255,0.03);
    color:var(--ink);
    font-family:var(--font-body);
    font-weight:600;
    font-size:1rem;
    cursor:pointer;
    transition:border-color .25s var(--ease), box-shadow .3s var(--ease), transform .2s var(--ease);
  }
  .version-pill:hover{
    border-color:var(--ember-soft);
    box-shadow:
      0 0 0 1px rgba(255,110,50,0.08),
      0 0 32px -4px rgba(255,106,43,0.6),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .version-pill:active{ transform:scale(0.98); }
  .version-pill.is-open{
    border-color:var(--ember);
    box-shadow:
      0 0 0 1px rgba(255,110,50,0.12),
      0 0 36px -2px rgba(255,106,43,0.7),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .version-current{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .version-current .v-number{
    font-family:var(--font-mono);
    letter-spacing:0.01em;
  }

  .chevron{
    flex-shrink:0;
    width:18px; height:18px;
    color:var(--ember);
    transition:transform .3s var(--ease);
  }
  .version-pill.is-open .chevron{
    transform:rotate(180deg);
  }

  .version-dropdown{
    position:absolute;
    top:calc(100% + 10px);
    left:50%;
    width:100%;
    max-width:280px;
    transform:translate(-50%, -8px) scale(0.96);
    background:var(--panel);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-m);
    box-shadow:
      0 20px 50px -16px rgba(0,0,0,0.7),
      0 0 30px -10px rgba(255,106,43,0.35);
    padding:6px;
    opacity:0;
    visibility:hidden;
    pointer-events:none;
    transition:opacity .22s var(--ease), transform .22s var(--ease), visibility .22s;
    z-index:20;
  }
  .version-dropdown.is-open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transform:translate(-50%, 0) scale(1);
  }

  .version-option{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    padding:11px 14px;
    border-radius:calc(var(--radius-m) - 4px);
    background:transparent;
    border:none;
    color:var(--ink-dim);
    font-family:var(--font-mono);
    font-size:0.92rem;
    text-align:left;
    cursor:pointer;
    transition:background .18s var(--ease), color .18s var(--ease);
  }
  .version-option:hover{
    background:rgba(255,110,50,0.1);
    color:var(--ink);
  }
  .version-option.is-selected{
    color:var(--ember-soft);
    background:rgba(255,110,50,0.08);
  }
  .version-option .check{
    width:16px; height:16px;
    color:var(--ember);
    opacity:0;
    transition:opacity .15s var(--ease);
  }
  .version-option.is-selected .check{ opacity:1; }

  /* ============================================================
     Download cards
     ============================================================ */
  .downloads{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .download-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:18px 20px;
    border-radius:var(--radius-l);
    background:linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.005));
    border:1px solid var(--line);
    transition:border-color .3s var(--ease), transform .3s var(--ease), box-shadow .3s var(--ease);
    animation:card-in .5s var(--ease) both;
  }
  .download-card:hover{
    border-color:var(--line-strong);
    transform:translateY(-2px);
    box-shadow:0 16px 40px -20px rgba(0,0,0,0.6);
  }

  @keyframes card-in{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .download-info{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
  }
  .download-icon{
    flex-shrink:0;
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    border-radius:12px;
    background:rgba(255,110,50,0.12);
    color:var(--ember-soft);
    box-shadow:inset 0 0 0 1px rgba(255,110,50,0.25);
  }
  .download-icon svg{ width:22px; height:22px; }

  .download-text h3{
    margin:0 0 2px;
    font-family:var(--font-display);
    font-size:1.02rem;
    font-weight:600;
  }
  .download-text p{
    margin:0;
    font-size:0.82rem;
    color:var(--ink-faint);
  }
  .oss-badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:4px;
    padding:0 !important;
    background:none !important;
    border:none !important;
    box-shadow:none !important;
    font-size:0.74rem;
    font-weight:500;
    letter-spacing:0.01em;
    color:var(--ink-faint);
  }
  .oss-badge svg{ width:11px; height:11px; }

  .download-action{
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    border-radius:var(--radius-pill);
    font-family:var(--font-body);
    font-weight:600;
    font-size:0.88rem;
    background:linear-gradient(135deg, var(--ember), var(--crimson));
    color:#fff2e8;
    box-shadow:0 8px 22px -10px rgba(255,90,30,0.55);
    transition:transform .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    white-space:nowrap;
  }
  .download-action:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 28px -10px rgba(255,90,30,0.75);
  }
  .download-action svg{ width:16px; height:16px; }

  .download-action.is-disabled{
    background:rgba(255,255,255,0.04);
    color:var(--ink-faint);
    box-shadow:none;
    cursor:not-allowed;
    pointer-events:none;
  }

  .note{
    margin-top:22px;
    text-align:center;
    font-size:0.82rem;
    color:var(--ink-faint);
  }

  @media (max-width:480px){
    .download-card{
      flex-direction:column;
      align-items:flex-start;
    }
    .download-action{ width:100%; justify-content:center; }
  }

  /* ---------------- Loading screen ---------------- */
  .load-screen{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse 120% 80% at 50% 40%,#1a0d1f 0%,#0a0503 60%);animation:load-screen-out 1.1s cubic-bezier(.22,.61,.36,1) forwards;}
  @keyframes load-screen-out{0%,55%{opacity:1;visibility:visible;}100%{opacity:0;visibility:hidden;pointer-events:none;}}
  .load-inner{display:flex;flex-direction:column;align-items:center;gap:20px;}
  .load-mark{width:44px;height:44px;display:block;animation:load-pulse .9s ease-in-out infinite;filter:drop-shadow(0 0 18px rgba(255,140,70,.55));}
  @keyframes load-pulse{0%,100%{transform:scale(1);opacity:.82;}50%{transform:scale(1.14);opacity:1;}}
  .load-text{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:.95rem;letter-spacing:.04em;color:#f6ede4;}
  .load-text em{font-style:normal;color:#ffb37a;}
  .load-bar{width:120px;height:4px;border-radius:999px;background:rgba(255,180,130,.14);overflow:hidden;}
  .load-bar span{display:block;height:100%;width:36%;border-radius:999px;background:linear-gradient(90deg,#ffc46b,#ff6a2b);animation:load-sweep .7s ease-in-out infinite;}
  @keyframes load-sweep{0%{transform:translateX(-120%);}100%{transform:translateX(300%);}}
  @media (prefers-reduced-motion: reduce){
    .load-screen{animation-duration:.01ms;animation-delay:0s;}
    .load-mark,.load-bar span{animation:none;}
  }
</style>
</head>
<body>

<!-- Loading screen -->
<div id="loadScreen" class="load-screen" aria-hidden="true">
  <div class="load-inner">
    <svg class="load-mark" width="44" height="44" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2L4 22h8l-2 8 14-20h-8l0-8z" fill="url(#loadGrad)"/>
      <defs>
        <linearGradient id="loadGrad" x1="4" y1="2" x2="24" y2="30" gradientUnits="userSpaceOnUse">
          <stop stop-color="#FFC46B"/>
          <stop offset="0.55" stop-color="#FF6A2B"/>
          <stop offset="1" stop-color="#B21F1F"/>
        </linearGradient>
      </defs>
    </svg>
    <p class="load-text">VERTEX <em>MODS</em></p>
    <div class="load-bar"><span></span></div>
  </div>
</div>

<div class="page">

  <div class="page-head">
    <p class="eyebrow"><a href="index.html" style="color:inherit;">← Vertex Mods</a></p>
    <h1>Choose your version</h1>
    <p>Pick the Minecraft version you're running, then grab the matching build.</p>
  </div>

  <!-- VERSION SELECTOR -->
  <div class="version-block">
    <p class="version-label">Version</p>

    <button
      type="button"
      class="version-pill"
      id="versionPill"
      aria-haspopup="listbox"
      aria-expanded="false">
      <span class="version-current">
        <span class="v-number" id="currentVersion">1.21.11</span>
      </span>
      <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="version-dropdown" id="versionDropdown" role="listbox" aria-label="Select version">
      <button type="button" class="version-option is-selected" role="option" aria-selected="true" data-version="1.21.11">
        <span>1.21.11</span>
        <svg class="check" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="version-option" role="option" aria-selected="false" data-version="1.21.4">
        <span>1.21.4</span>
        <svg class="check" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="version-option" role="option" aria-selected="false" data-version="26.1.2">
        <span>26.1.2</span>
        <svg class="check" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <!-- DOWNLOAD CARDS -->
  <div class="downloads">

    <div class="download-card">
      <div class="download-info">
        <div class="download-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="24" cy="24" r="6" stroke="currentColor" stroke-width="2.4"/>
            <circle cx="18" cy="18" r="1.3" fill="currentColor"/>
            <circle cx="30" cy="19" r="1.3" fill="currentColor"/>
            <circle cx="31" cy="29" r="1.3" fill="currentColor"/>
            <circle cx="17" cy="29" r="1.3" fill="currentColor"/>
          </svg>
        </div>
        <div class="download-text">
          <h3>Glazed Spoofer</h3>
          <p id="glazedMeta">For 1.21.11</p>
          <span class="oss-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Open Source</span>
        </div>
      </div>
      <a class="download-action" id="glazedBtn" href="#" data-mod="Glazed Spoofer">
        <span id="glazedLabel">Download</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

    <div class="download-card">
      <div class="download-info">
        <div class="download-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 40 L40 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
            <path d="M40 8 L26 11 L37 20 Z" fill="currentColor"/>
            <circle cx="14" cy="34" r="2" fill="currentColor" opacity="0.6"/>
            <circle cx="20" cy="28" r="1.4" fill="currentColor" opacity="0.4"/>
          </svg>
        </div>
        <div class="download-text">
          <h3>Meteor Client</h3>
          <p id="meteorMeta">For 1.21.11</p>
          <span class="oss-badge"><svg viewBox="0 0 24 24" fill="none"><path d="M9 6l-5 6 5 6M15 6l5 6-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> Open Source</span>
        </div>
      </div>
      <a class="download-action" id="meteorBtn" href="#" data-mod="Meteor Client">
        <span id="meteorLabel">Download</span>
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    </div>

  </div>

  <p class="note">Downloads are direct links — no third-party redirects.</p>

</div>

<script>
(function(){
  "use strict";

  // ----------------------------------------------------------
  // Data: download links per version. `null` = not yet available.
  // ----------------------------------------------------------
  const VERSIONS = {
    "1.21.11": {
      glazed: "https://drive.google.com/uc?export=download&id=1bz_4yasl8psfVGVjFgmHKtCRx3Q2ekTz",
      meteor: "https://drive.google.com/uc?export=download&id=1RMzQUQhiDYRKS0xuBY42j_QFdehZg5KE"
    },
    "1.21.4": {
      glazed: "https://drive.google.com/uc?export=download&id=1M7OE42bwj79OCcnZneToAEacbNvRND6-",
      meteor: "https://drive.google.com/uc?export=download&id=1YRO8eEI4bwlq3WKF9J5ExbaQzMV_ZFCK"
    },
    "26.1.2": {
      glazed: "https://drive.google.com/uc?export=download&id=1WBCewxGEShjSPOQXJz-F7bfCKAK5tMKJ",
      meteor: "https://drive.google.com/uc?export=download&id=1LITAHJlJC2-2rNwuXVXX9HnN63jA2XA4"
    }
  };

  const DEFAULT_VERSION = "1.21.11";

  const pill         = document.getElementById('versionPill');
  const dropdown      = document.getElementById('versionDropdown');
  const currentLabel  = document.getElementById('currentVersion');
  const options        = Array.from(dropdown.querySelectorAll('.version-option'));

  const glazedBtn   = document.getElementById('glazedBtn');
  const glazedLabel = document.getElementById('glazedLabel');
  const glazedMeta  = document.getElementById('glazedMeta');

  const meteorBtn   = document.getElementById('meteorBtn');
  const meteorLabel = document.getElementById('meteorLabel');
  const meteorMeta  = document.getElementById('meteorMeta');

  function setDownload(btn, labelEl, metaEl, url, version){
    metaEl.textContent = `For ${version}`;
    if (url){
      btn.href = url;
      btn.removeAttribute('aria-disabled');
      btn.classList.remove('is-disabled');
      labelEl.textContent = 'Download';
    } else {
      btn.href = '#';
      btn.setAttribute('aria-disabled', 'true');
      btn.classList.add('is-disabled');
      labelEl.textContent = 'Coming soon';
    }
  }

  function applyVersion(version){
    const data = VERSIONS[version] || VERSIONS[DEFAULT_VERSION];
    currentLabel.textContent = version;

    options.forEach(opt => {
      const isSelected = opt.dataset.version === version;
      opt.classList.toggle('is-selected', isSelected);
      opt.setAttribute('aria-selected', isSelected ? 'true' : 'false');
    });

    setDownload(glazedBtn, glazedLabel, glazedMeta, data.glazed, version);
    setDownload(meteorBtn, meteorLabel, meteorMeta, data.meteor, version);
  }

  function openDropdown(){
    dropdown.classList.add('is-open');
    pill.classList.add('is-open');
    pill.setAttribute('aria-expanded', 'true');
  }

  function closeDropdown(){
    dropdown.classList.remove('is-open');
    pill.classList.remove('is-open');
    pill.setAttribute('aria-expanded', 'false');
  }

  pill.addEventListener('click', () => {
    const isOpen = dropdown.classList.contains('is-open');
    if (isOpen) closeDropdown(); else openDropdown();
  });

  options.forEach(opt => {
    opt.addEventListener('click', () => {
      applyVersion(opt.dataset.version);
      closeDropdown();
      pill.focus();
    });
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.version-block')){
      closeDropdown();
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDropdown();
  });

  // disabled placeholder buttons shouldn't navigate
  [glazedBtn, meteorBtn].forEach(btn => {
    btn.addEventListener('click', (e) => {
      if (btn.classList.contains('is-disabled')){
        e.preventDefault();
      }
    });
  });

  // init
  applyVersion(DEFAULT_VERSION);
})();
</script>

</body>
</html>
